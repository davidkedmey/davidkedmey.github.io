<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Biomorph Farm</title>
  <meta name="description" content="Farm biomorphs, trade with NPCs, and walk the botanical gardens of morphospace.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Biomorph Farm">
  <meta property="og:description" content="Farm biomorphs, trade with NPCs, and walk the botanical gardens of morphospace.">
  <meta property="og:image" content="https://biomorphbuilder.com/og-image.png">
  <meta property="og:url" content="https://biomorphbuilder.com/game/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" sizes="32x32" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="site-nav">
    <a href="../">Hub</a>
    <a href="../breed.html">Breed</a>
    <a href="../3d/">3D</a>
    <a href="../dawkins-paper/">Read</a>
  </nav>
  <canvas id="game" width="960" height="768"></canvas>
  <div id="controls-bar">
    <div id="controls-ref">
      <span class="key-group"><kbd>Arrows</kbd> Move</span>
      <span class="key-group"><kbd>Space</kbd> Interact</span>
      <span class="key-group"><kbd>I</kbd> Inventory</span>
      <span class="key-group"><kbd>1-9</kbd> Select slot</span>
      <span class="key-group"><kbd>T</kbd><small>hold</small> Fast-fwd</span>
      <span class="key-group"><kbd>Q</kbd> Follow NPC</span>
      <span class="key-group"><kbd>P</kbd> Pause</span>
      <span class="key-group"><kbd>/</kbd> Command</span>
      <span class="key-group"><kbd>H</kbd> Help</span>
      <span class="key-group"><kbd>Right-drag</kbd> Pan camera</span>
    </div>
    <a href="#" id="new-game">New Game</a>
  </div>
  <script>
    document.getElementById('new-game').addEventListener('click', e => {
      e.preventDefault();
      if (confirm('Start a new game? This will erase your save.')) {
        localStorage.removeItem('biomorph-farm-save');
        location.reload();
      }
    });
    if (location.search.includes('reset')) {
      localStorage.removeItem('biomorph-farm-save');
      history.replaceState(null, '', location.pathname);
    }
    // ?level= param: store in sessionStorage for main.js to auto-launch
    const params = new URLSearchParams(location.search);
    const levelParam = params.get('level');
    if (levelParam) {
      sessionStorage.setItem('biomorph-auto-level', levelParam);
      history.replaceState(null, '', location.pathname);
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
